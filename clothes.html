<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Edit — MANIPU Clothing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#141c19;
    --ink-soft:#3a4744;
    --paper:#faf8f3;
    --card:#ffffff;
    --emerald:#1f5c4a;
    --emerald-deep:#123f33;
    --emerald-mist:rgba(31,92,74,.10);
    --sand:#e6dfd0;
    --sand-line:#e2ddd0;
    --ease:cubic-bezier(.16,1,.3,1);
    --radius-pill:999px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--paper);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  img{max-width:100%;display:block;}

  /* ---------- HEADER / LOOKBOOK BANNER ---------- */
  header{
    background:var(--ink);color:var(--paper);
    padding:64px 28px 46px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  header::before{
    content:'';position:absolute;inset:0;
    background:
      radial-gradient(60% 80% at 15% 0%, var(--emerald-mist) 0%, transparent 60%),
      radial-gradient(50% 70% at 90% 100%, rgba(230,223,208,.06) 0%, transparent 60%);
    pointer-events:none;
  }
  .logo{
    position:relative;z-index:1;
    font-family:'Inter',sans-serif;font-weight:700;font-size:1rem;
    letter-spacing:.14em;
    color:var(--paper);opacity:.75;
    margin-bottom:22px;
  }
  .logo span{color:#5fbfa1;}
  .eyebrow{
    position:relative;z-index:1;
    font-size:.74rem;letter-spacing:.32em;text-transform:uppercase;
    color:#5fbfa1;font-weight:600;margin-bottom:18px;
  }
  header h1{
    position:relative;z-index:1;
    font-family:'Fraunces',serif;font-weight:600;font-style:italic;
    font-size:clamp(2.2rem,5.2vw,3.8rem);
    line-height:1.1;
    max-width:720px;margin:0 auto 14px;
  }
  header p{
    position:relative;z-index:1;
    max-width:460px;margin:0 auto;
    color:rgba(250,248,243,.62);
    font-size:.96rem;line-height:1.6;
  }

  /* ---------- FILTERS ---------- */
  .filter-bar{
    position:sticky;top:0;z-index:40;
    background:var(--paper);
    border-bottom:1px solid var(--sand-line);
  }
  .filter-inner{
    max-width:1280px;margin:0 auto;
    display:flex;gap:10px;
    padding:18px 28px;
    overflow-x:auto;
    scrollbar-width:none;
  }
  .filter-inner::-webkit-scrollbar{display:none;}
  .filter-pill{
    flex-shrink:0;
    padding:10px 20px;
    border-radius:var(--radius-pill);
    border:1.5px solid var(--sand-line);
    background:var(--card);
    color:var(--ink-soft);
    font-size:.84rem;font-weight:600;
    transition:background .2s var(--ease), color .2s var(--ease), border-color .2s var(--ease);
    white-space:nowrap;
  }
  .filter-pill:hover{border-color:var(--emerald);color:var(--emerald-deep);}
  .filter-pill.active{
    background:var(--emerald-deep);border-color:var(--emerald-deep);color:var(--paper);
  }

  /* ---------- MAIN / MASONRY ---------- */
  main{max-width:1280px;margin:0 auto;padding:34px 24px 90px;}
  .results-meta{
    font-size:.82rem;color:var(--ink-soft);margin-bottom:20px;
    min-height:1.2em;
  }
  .results-meta strong{color:var(--ink);}

  .masonry{
    column-count:4;
    column-gap:22px;
  }
  @media (max-width:1080px){ .masonry{column-count:3;} }
  @media (max-width:760px){ .masonry{column-count:2;column-gap:14px;} }
  @media (max-width:480px){ .masonry{column-count:1;} }

  .item{
    break-inside:avoid;
    margin-bottom:22px;
    background:var(--card);
    border-radius:14px;
    overflow:hidden;
    border:1px solid var(--sand-line);
    transition:box-shadow .25s var(--ease), transform .25s var(--ease);
  }
  @media (max-width:760px){ .item{margin-bottom:14px;} }
  .item:hover{
    box-shadow:0 20px 40px rgba(20,28,25,.12);
    transform:translateY(-3px);
  }

  .item-media{
    position:relative;
    overflow:hidden;
    background:var(--sand);
  }
  .item-media img{
    width:100%;height:auto;display:block;
    transition:transform .5s var(--ease);
  }
  .item:hover .item-media img{transform:scale(1.06);}

  .media-overlay{
    position:absolute;inset:0;
    background:linear-gradient(to top, rgba(18,30,25,.75) 0%, rgba(18,30,25,0) 45%);
    opacity:0;
    display:flex;align-items:flex-end;justify-content:center;
    padding-bottom:20px;
    transition:opacity .3s var(--ease);
  }
  .item:hover .media-overlay{opacity:1;}
  .quick-view-btn{
    background:var(--paper);color:var(--ink);
    padding:11px 24px;border-radius:var(--radius-pill);
    font-size:.8rem;font-weight:700;letter-spacing:.03em;
    transform:translateY(10px);
    transition:transform .3s var(--ease), background .2s var(--ease);
  }
  .item:hover .quick-view-btn{transform:translateY(0);}
  .quick-view-btn:hover{background:#5fbfa1;color:var(--ink);}

  .item-body{padding:16px 18px 20px;}
  .item-category{
    font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;
    color:var(--emerald);font-weight:700;margin-bottom:6px;
  }
  .item-name{
    font-family:'Fraunces',serif;font-weight:600;font-size:1.08rem;
    color:var(--ink);line-height:1.3;margin-bottom:8px;
  }
  .item-price{
    font-size:.95rem;font-weight:700;color:var(--ink-soft);
  }

  /* ---------- SKELETON ---------- */
  .skel{
    break-inside:avoid;margin-bottom:22px;
    background:var(--card);border-radius:14px;overflow:hidden;border:1px solid var(--sand-line);
  }
  .skel-media{width:100%;background:linear-gradient(100deg,#eee7d8 30%,#f4efe4 50%,#eee7d8 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  .skel-line{height:11px;border-radius:6px;margin:16px 18px 0;background:linear-gradient(100deg,#eee7d8 30%,#f4efe4 50%,#eee7d8 70%);background-size:200% 100%;animation:shimmer 1.3s infinite;}
  .skel-line.w40{width:40%;}
  .skel-line.w70{width:70%;margin-top:10px;}
  .skel-line.w30{width:30%;margin:10px 18px 18px;}
  @keyframes shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}

  /* ---------- STATE PANEL ---------- */
  .state-panel{
    column-span:all;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:90px 20px;color:var(--ink-soft);
  }
  .state-panel .state-icon{
    width:60px;height:60px;border-radius:50%;
    background:var(--emerald-mist);color:var(--emerald-deep);
    display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  }
  .state-panel h3{font-family:'Fraunces',serif;font-size:1.15rem;color:var(--ink);margin-bottom:6px;}
  .state-panel p{font-size:.88rem;max-width:340px;}
</style>
</head>

<script>
  /* ============================================================
     BACKEND ENDPOINT
     GET http://localhost:3000/api/clothes
     Expected response: JSON array of clothing items with fields:
     id, name, price, category, image_url

     Filtering by category happens client-side against the fetched
     array (no category query param assumed on the backend). If your
     backend later supports ?category=, swap fetchClothes() to pass
     it through instead.
  ============================================================ */
/* ============================================================
     BAHAGI 1: MGA VARIABLES AT CONFIGURATION
============================================================ */
// 🔌 TUGMA SA IYONG INDEX.JS: Itinuro natin sa tamang local backend port
const API_URL = 'http://localhost:3000/api/clothes';

let selectedSize = '';
let quantity = 1;
let selectedProduct = null;
let shoppingCart = [];
let allItems = []; // Imbakan ng mga damit galing backend

// Imbakan para sa maramihang larawan ng damit sa slider
let productImages = [];
let currentImageIndex = 0;

// Mga HTML Element Containers
const grid = document.getElementById('clothes-grid') || document.querySelector('.grid');
const resultsMeta = document.getElementById('results-meta');
let activeCategory = 'All';

/* ============================================================
     BAHAGI 2: RENDER SYSTEM (TIGA-SAMPAL NG MGA DAMIT SA SCREEN)
============================================================ */
function renderEmptyState(){
  if (grid) {
    grid.innerHTML = `
      <div class="state-panel">
        <h3>Wala pang piece dito</h3>
        <p>No items in this category yet — try another filter, or check back soon.</p>
      </div>
    `;
  }
  if (resultsMeta) resultsMeta.textContent = '';
}

function renderErrorState(){
  if (grid) {
    grid.innerHTML = `
      <div class="state-panel">
        <h3>Couldn't load the collection</h3>
        <p>Please check that your backend at <strong>localhost:3000</strong> is running, then refresh.</p>
      </div>
    `;
  }
  if (resultsMeta) resultsMeta.textContent = '';
}

function renderItems(items){
  if(!Array.isArray(items) || items.length === 0){
    renderEmptyState();
    return;
  }

  if(resultsMeta) {
    resultsMeta.innerHTML = `<strong>${items.length}</strong> piece${items.length === 1 ? '' : 's'}${activeCategory !== 'All' ? ` in <strong>${escapeHtml(activeCategory)}</strong>` : ''}`;
  }

  if (grid) {
    grid.innerHTML = '';
    items.forEach(item => {
      const card = document.createElement('div');
      card.className = 'item';
      card.innerHTML = `
        <div class="item-media">
          <img src="${item.image_url || ''}" alt="${escapeHtml(item.name || 'Clothing item')}" loading="lazy"
               onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://w3.org width=%22400%22 height=%22500%22><rect width=%22100%%22 height=%22100%%22 fill=%22%23e6dfd0%22/></svg>'">
          <div class="media-overlay">
            <button class="quick-view-btn" onclick="quickView('${item.id}')">Quick View</button>
          </div>
        </div>
        <div class="item-body">
          <div class="item-category">${escapeHtml(item.category || '')}</div>
          <div class="item-name">${escapeHtml(item.name || 'Untitled piece')}</div>
          <div class="item-price">${formatPrice(item.price)}</div>
        </div>
      `;
      grid.appendChild(card);
    });
  }
}

function applyFilter(){ 
  const filtered = activeCategory === 'All' ? allItems : allItems.filter(item => { 
    const itemCat = (item.category || '').trim().toLowerCase(); 
    const activeCat = (activeCategory || '').trim().toLowerCase(); 
    return itemCat === activeCat; 
  }); 
  renderItems(filtered); 
}

/* ============================================================
     BAHAGI 3: LIGTAS AT KUMPLETONG MODAL LOGIC (IMAGERY, MATH, & CART)
============================================================ */
function quickView(id){
  selectedProduct = allItems.find(p => String(p.id) === String(id));
  
  if(selectedProduct) {
    productImages = [];
    
    if (selectedProduct.image_url) productImages.push(selectedProduct.image_url);
    if (selectedProduct.image_url_back) productImages.push(selectedProduct.image_url_back);

    if (productImages.length === 0) {
      productImages.push('data:image/svg+xml;utf8,<svg xmlns="http://w3.org" width="400" height="500"><rect width="100%" height="100%" fill="%23e6dfd0"/></svg>');
    }

    currentImageIndex = 0;
    updateModalImage();

    const nameEl = document.getElementById('detail-name');
    const priceEl = document.getElementById('detail-price-each');
    
    if (nameEl) nameEl.innerText = selectedProduct.name || 'Untitled piece';
    if (priceEl) priceEl.innerText = "Unit Price: " + formatPrice(selectedProduct.price);

    quantity = 1;
    selectedSize = '';
    
    const qtyCountEl = document.getElementById('quantity-count');
    if (qtyCountEl) qtyCountEl.innerText = quantity;
    
    resetSizeButtons();
    calculateTotalPrice();

    const modal = document.getElementById('product-modal');
    if (modal) modal.style.display = 'flex';
  }
}

function updateModalImage() {
  const imgContainer = document.getElementById('detail-image');
  const indicator = document.getElementById('pic-indicator');
  
  if (imgContainer && productImages.length > 0) {
    imgContainer.src = productImages[currentImageIndex];
    if (indicator) {
      indicator.innerText = `${currentImageIndex + 1} / ${productImages.length}`;
    }
  }
}

function closeProductModal() {
  const modal = document.getElementById('product-modal');
  if (modal) modal.style.display = 'none';
}

function calculateTotalPrice() {
  const totalEl = document.getElementById('detail-total-price');
  if (selectedProduct && totalEl) {
    const basePrice = Number(selectedProduct.price) || 0;
    const total = basePrice * quantity;
    totalEl.innerText = formatPrice(total);
  }
}

function resetSizeButtons() {
  document.querySelectorAll('.size-btn').forEach(btn => {
    btn.style.borderColor = '#cbd5e1';
    btn.style.backgroundColor = '#fff';
    btn.style.color = '#0f2c20';
  });
}

/* ============================================================
     BAHAGI 4: EVENT LISTENERS & BACKEND CONNECTION
============================================================ */
document.addEventListener("DOMContentLoaded", () => {
  
  document.getElementById('btn-prev-pic')?.addEventListener('click', (e) => {
    e.preventDefault();
    if (productImages.length > 1) {
      currentImageIndex = (currentImageIndex - 1 + productImages.length) % productImages.length;
      updateModalImage();
    }
  });

  document.getElementById('btn-next-pic')?.addEventListener('click', (e) => {
    e.preventDefault();
    if (productImages.length > 1) {
      currentImageIndex = (currentImageIndex + 1) % productImages.length;
      updateModalImage();
    }
  });

  document.getElementById('btn-plus')?.addEventListener('click', () => {
    quantity++;
    const qtyCountEl = document.getElementById('quantity-count');
    if (qtyCountEl) qtyCountEl.innerText = quantity;
    calculateTotalPrice();
  });

  document.getElementById('btn-minus')?.addEventListener('click', () => {
    if (quantity > 1) {
      quantity--;
      const qtyCountEl = document.getElementById('quantity-count');
      if (qtyCountEl) qtyCountEl.innerText = quantity;
      calculateTotalPrice();
    }
  });

  document.querySelectorAll('.size-btn').forEach(button => {
    button.addEventListener('click', (e) => {
      resetSizeButtons();
      e.target.style.borderColor = '#111';
      e.target.style.backgroundColor = '#111';
      e.target.style.color = '#fff';
      selectedSize = e.target.innerText;
    });
  });

  document.getElementById('btn-add-to-cart')?.addEventListener('click', () => {
    if (!selectedProduct) return alert("Pumili muna ng damit.");
    if (!selectedSize) return alert("Mangyaring pumili muna ng Size.");

    const itemPrice = Number(selectedProduct.price) || 0;
    const cartItem = {
      product_id: selectedProduct.id,
      name: selectedProduct.name,
      size: selectedSize,
      quantity: quantity,
      price_each: itemPrice,
      total_price: itemPrice * quantity,
      chosen_image: productImages[currentImageIndex]
    };

    shoppingCart.push(cartItem);
    const totalDisplay = typeof formatPrice === 'function' ? formatPrice(cartItem.total_price) : `$${cartItem.total_price.toFixed(2)}`;
    alert(`Naidagdag na sa Cart:\n${cartItem.quantity}x ${cartItem.name} (${cartItem.size})\nKabuuang Halaga: ${totalDisplay}`);
    closeProductModal();
  });

  if (document.getElementById('filterBar')) {
    document.getElementById('filterBar').addEventListener('click', (e)=>{
      const btn = e.target.closest('.filter-pill');
      if(!btn) return;
      document.querySelectorAll('.filter-pill').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      activeCategory = btn.dataset.category;
      applyFilter();
    });
  }

  // Awtomatikong tinatawag ang backend pagkabukas ng webpage
  fetchClothes();
});

function escapeHtml(str) {
  if (!str) return '';
  return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
}
